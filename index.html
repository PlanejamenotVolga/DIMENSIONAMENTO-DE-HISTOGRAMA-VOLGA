<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DIMENSIONAMENTO DE HISTOGRAMA</title>
<link rel="icon" type="image/png" href="favicon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--g1:#1f3a16;--g2:#2f6a22;--g3:#4d8a3c;--gt:#e7f0e2;--gr:#657067;--gl:#eef1ed;--bd:#dde2db;--tx:#1c241d;--bg:#f5f7f4;--amb:#c8791a;--red:#b42318;--r:10px}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 "Segoe UI Variable","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--tx);background:var(--bg);-webkit-font-smoothing:antialiased}
header{background:var(--g1);color:#fff;padding:14px 24px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:4px solid var(--g3)}
header h1{font-size:19px;font-weight:700;letter-spacing:-.01em;margin:0;flex:1;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
header h1 small{font-size:12px;font-weight:500;color:#a9c7a0;letter-spacing:0}
header button{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.22);font-size:13px}
header button:hover{background:rgba(255,255,255,.18);filter:none}
nav{display:flex;gap:4px;background:#fff;padding:8px 24px;overflow-x:auto;border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
nav button{border:0;background:none;padding:8px 16px;cursor:pointer;font-weight:600;color:var(--gr);border-radius:999px;white-space:nowrap;transition:background .15s,color .15s}
nav button:hover{background:var(--gl);filter:none}
nav button.on{color:#fff;background:var(--g2)}
main{padding:22px 24px 48px;max-width:1500px;margin:auto}
button{font:inherit;padding:6px 14px;border:1px solid var(--bd);background:#fff;border-radius:8px;cursor:pointer;color:var(--tx);transition:background .15s,border-color .15s}
button:hover{background:var(--gl)}
button.p{background:var(--g2);color:#fff;border-color:var(--g2);font-weight:600}button.p:hover{background:var(--g1)}
button.d{color:var(--red)}button.d:hover{background:#fdecea;border-color:#f3b8b2}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.list .it:focus-visible{outline:2px solid var(--g3);outline-offset:1px}
input,select,textarea{font:inherit;padding:6px 9px;border:1px solid var(--bd);border-radius:8px;background:#fff;max-width:100%;color:var(--tx)}
input:hover,select:hover,textarea:hover{border-color:#b9c2b7}
input:focus,select:focus,textarea:focus{border-color:var(--g3);outline:none;box-shadow:0 0 0 3px rgba(77,138,60,.18)}
table{border-collapse:separate;border-spacing:0;width:100%;background:#fff;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--bd);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--gt);color:var(--g1);position:sticky;top:0;z-index:1;font-weight:700;font-size:12.5px;border-bottom:2px solid #c3d6ba}
tbody tr:hover td{background:#f2f7ef}
td.n,th.n{text-align:right}
.card{background:#fff;border:1px solid var(--bd);border-radius:var(--r);padding:18px;margin-bottom:18px}
.card h3,.card h4{margin:0 0 12px;font-size:15px;letter-spacing:-.005em;color:var(--g1)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin-bottom:14px}
.row label{display:flex;flex-direction:column;font-size:12px;font-weight:600;color:var(--gr);gap:4px}
.grid{display:grid;grid-template-columns:280px 1fr;gap:18px;align-items:start}@media(max-width:900px){.grid{grid-template-columns:1fr}}
.list .it{padding:10px 12px;border:1px solid var(--bd);border-left:4px solid transparent;border-radius:8px;margin-bottom:8px;cursor:pointer;background:#fff;transition:background .15s}
.list .it:hover{background:var(--gl)}
.list .it.on{border-color:var(--g3);border-left-color:var(--g2);background:var(--gt)}
.list .it small{color:var(--gr);display:block;margin-top:2px}
.scroll{max-height:420px;overflow:auto;border:1px solid var(--bd);border-radius:8px}
.chip{display:inline-block;background:var(--gt);color:var(--g1);border-radius:999px;padding:1px 9px;margin:2px;font-size:11.5px;font-weight:500}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--gt);border:0;border-radius:var(--r);padding:12px 16px;min-width:0}
.kpi b{display:block;font-size:26px;line-height:1.15;font-weight:700;letter-spacing:-.02em;color:var(--g1);font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--gr)}
.alert{background:#fff6e5;border:1px solid #f0cf8f;border-left:4px solid var(--amb);padding:10px 14px;border-radius:8px;margin-bottom:14px}
.gantt{overflow:auto;border:1px solid var(--bd);border-radius:8px;background:#fff}
.legend{margin:4px 0 12px}.legend span{display:inline-flex;align-items:center;margin-right:14px;font-size:12px}.legend i{width:12px;height:12px;border-radius:3px;display:inline-block;margin-right:6px}
.dias{display:flex;gap:6px;flex-wrap:wrap}.dia{flex-direction:row!important;align-items:center;gap:6px!important;padding:6px 12px;border:1px solid var(--bd);border-radius:999px;background:#fff;cursor:pointer;font-weight:600;color:var(--gr);user-select:none}.dia.on{background:var(--gt);border-color:var(--g3);color:var(--g1)}.dia input{accent-color:var(--g2);margin:0}
.hint{color:var(--gr);font-size:12px}.hide{display:none}
</style></head><body>

async function listarProjetos() {
  if (!sb) return alert('Supabase indisponível. Modo local.');
  const { data, error } = await sb
    .from('projects')
    .select('id, name, updated_at')
    .order('updated_at', { ascending: false })
    .limit(50);
  if (error) return alert('Erro: ' + error.message);
  if (!data || !data.length) return alert('Nenhum projeto salvo ainda.');

  const txt = data
    .map((p, i) => `${i + 1}. ${p.name} — ${new Date(p.updated_at).toLocaleString('pt-BR')}`)
    .join('\n');
  const escolha = prompt('Projetos salvos (digite o número para abrir):\n\n' + txt, '1');
  const idx = parseInt(escolha, 10) - 1;
  if (!(idx >= 0 && idx < data.length)) return;

  const { data: full } = await sb
    .from('projects').select('*').eq('id', data[idx].id).single();
  if (!full) return;
  currentProjectId = full.id;
  currentProjectName = full.name;
  S = full.state;
  migrate(S);
  sel = null;
  atualizarNomeProjeto();
  render();
}

function crewCard(c,k){const rs=Object.keys(k.res);
 if(!rs.length)return'';
 const per=rs.map(r=>k.res[r]/crewN(c,r)),mx=Math.max(...per);
 return`<div style="background:#fff;border:1px solid var(--bd,#d1d5db);border-radius:10px;padding:12px;margin-bottom:14px"><h4 style="margin:0 0 4px">Composição da equipe</h4>
 <p class="hint" style="margin:0 0 8px">Defina quantas pessoas/recursos de cada tipo formam a equipe (mínimo 1 de cada). A duração de cada atividade é dada pelo recurso mais lento (horas ÷ quantidade). Para reduzir o prazo, aumente a quantidade do recurso gargalo.</p>
 <table><thead><tr><th>Recurso</th><th>Tipo</th><th class="n">Horas totais</th><th class="n">Quantidade</th><th class="n">Horas por unidade</th><th></th></tr></thead><tbody>${rs.map((r,i)=>{const n=crewN(c,r);return`<tr><td>${esc(r)}</td><td>${esc(TIPO[r]||'')}</td><td class="n">${fmt(k.res[r])}</td>
 <td class="n" style="white-space:nowrap"><button style="padding:1px 8px" ${n<=1?'disabled':''} onclick="setCrew(${i},${n-1})">−</button> <input type="number" min="1" step="1" style="width:60px;text-align:center" value="${n}" onchange="setCrew(${i},this.value)"> <button style="padding:1px 8px" onclick="setCrew(${i},${n+1})">+</button></td>
 <td class="n">${fmt(per[i])}</td><td>${per[i]>=mx-1e-9&&rs.length>1?'<span class="hint">gargalo</span>':''}</td></tr>`}).join('')}</tbody></table></div>`}

function rCron(){const sc=schedule(),U=usedComps();
 let rows='';S.comps.forEach(c=>{const s=sc[c.id];const k=s?s.k:compCalc(c);
  rows+=`<tr style="${c.usar?'':'color:#9ca3af'}"><td><input type="checkbox" ${c.usar?'checked':''} onchange="setSch('${c.id}','usar',this.checked)"></td><td>${esc(c.nome)}</td><td>${esc(c.disc)}</td><td class="n">${fmt(k.dur)}</td><td style="font-size:12px">${esc(crewLabel(c,s?s.k:compCalc(c)))}</td><td class="n">${k.days}</td>`;
  if(c.usar){rows+=`<td><select onchange="setSch('${c.id}','pred',this.value)"><option value="">— data fixa —</option>${U.filter(x=>x.id!==c.id).map(x=>`<option value="${x.id}" ${x.id===c.pred?'selected':''}>${esc(x.nome)}</option>`).join('')}</select></td>
   <td>${c.pred?`<input type="number" style="width:70px" value="${c.lag}" onchange="setSch('${c.id}','lag',this.value)">`:`<input type="date" value="${c.inicio||S.params.start}" onchange="setSch('${c.id}','inicio',this.value)">`}</td><td>${br(iso(s.ini))}</td><td>${br(iso(s.fim))}</td>`}
  else rows+='<td></td><td></td><td></td><td></td>';
  rows+=`<td style="white-space:nowrap"><button style="padding:1px 6px" onclick="mv('${c.id}',-1)">▲</button><button style="padding:1px 6px" onclick="mv('${c.id}',1)">▼</button></td></tr>`});
 const table=`<div class="card"><div class="row"><button onclick="markAll(true)">Marcar todas</button><button onclick="markAll(false)">Limpar seleção</button><button onclick="csvCron()">Exportar CSV</button><span class="hint">Marque as composições que entram na obra. Sem predecessora, a composição começa na data informada (padrão: início do projeto, ${br(S.params.start)}). Folga em dias úteis.</span></div>
 <div class="scroll" style="max-height:520px"><table><thead><tr><th>Usar</th><th>Composição</th><th>Disciplina</th><th class="n">Duração (h)</th><th>Equipe</th><th class="n">Dias úteis</th><th>Predecessora</th><th>Folga / Início</th><th>Início</th><th>Término</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
 const cs=U.filter(c=>sc[c.id].days.length);
 if(!cs.length){$('#main').innerHTML='<div class="card">Marque ao menos uma composição com atividades para gerar o cronograma.</div>'+table;return}
 const min=new Date(Math.min(...cs.map(c=>sc[c.id].ini))),max=new Date(Math.max(...cs.map(c=>sc[c.id].fim)));
 const tot=Math.round((max-min)/864e5)+1;
 const cw=14,lw=240;let hd='',mo='',last='';
 for(let i=0;i<tot;i++){const d=new Date(min);d.setDate(d.getDate()+i);const m=d.toLocaleDateString('pt-BR',{month:'short',year:'2-digit'});
  mo+=`<div style="position:absolute;left:${lw+i*cw}px;top:0;font-size:10px;font-weight:600;width:${cw}px;overflow:visible;white-space:nowrap">${m!==last?m:''}</div>`;last=m;
  hd+=`<div style="position:absolute;left:${lw+i*cw}px;top:14px;width:${cw}px;font-size:9px;text-align:center;color:${isW(d)?'#374151':'#9ca3af'}">${d.getDate()}</div>`}
 let bars='';U.forEach((c,i)=>{const s=sc[c.id];const y=34+i*26;
  bars+=`<div style="position:absolute;left:4px;top:${y+3}px;width:${lw-8}px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(c.nome)}</div>`;
  if(s.days.length){const x=lw+Math.round((s.ini-min)/864e5)*cw,w=(Math.round((s.fim-s.ini)/864e5)+1)*cw;
   bars+=`<div title="${esc(c.nome)}: ${br(iso(s.ini))} a ${br(iso(s.fim))}" style="position:absolute;left:${x}px;top:${y}px;width:${w}px;height:20px;background:${i%2?'#4d8a3c':'#2f6a22'};border-radius:4px;color:#fff;font-size:10px;line-height:20px;padding-left:4px;overflow:hidden">${s.k.days}d</div>`}});
 $('#main').innerHTML=`<div class="kpis"><div class="kpi"><b>${br(iso(min))}</b><span>Início</span></div><div class="kpi"><b>${br(iso(max))}</b><span>Término</span></div><div class="kpi"><b>${tot}</b><span>Dias corridos</span></div><div class="kpi"><b>${U.length}</b><span>Composições no cronograma</span></div></div>
 <div class="card"><div class="gantt"><div style="position:relative;height:${44+U.length*26}px;width:${lw+tot*cw+20}px">${mo}${hd}${bars}</div></div></div>`+table}
// Histograma
const PAL=['#2f6a22','#c8791a','#1f6f8b','#8fbf7a','#7a4e9e','#d9a441','#4d8a3c','#b8584b','#5aa6a0','#1f3a16','#9aa39b','#e0b8a0','#3d5a80','#6b7280'];
function colorOf(k,list){return PAL[list.indexOf(k)%PAL.length]}
function rHist(){const{map,sc}=histo();const days=Object.keys(map).sort();
 if(!days.length){$('#main').innerHTML='<div class="card">Sem dados: marque composições na aba Cronograma.</div>';return}
 const usedRes=REC.filter(r=>days.some(d=>map[d][r]));
 // série
 const ok=r=>hv.tipo==='Todos'||TIPO[r]===hv.tipo;
 const keys=hv.group==='recurso'?usedRes.filter(ok):[...new Set(usedComps().map(c=>c.disc))];
 // matriz por dia e chave
 let dm={};
 if(hv.group==='recurso'){days.forEach(d=>{dm[d]={};for(const r of usedRes)if(ok(r)&&map[d][r])dm[d][r]=hv.round?Math.ceil(map[d][r]-1e-9):map[d][r]})}
 else{usedComps().forEach(c=>{const s=sc[c.id];s.days.forEach(d=>{dm[d]=dm[d]||{};let sum=0;for(const[r,h]of Object.entries(s.k.res))if(ok(r))sum+=h/(s.days.length*hpd());dm[d][c.disc]=(dm[d][c.disc]||0)+sum})})}
 let cols=days.map(d=>({d,v:dm[d]||{}}));
 if(hv.gran==='semana'){const w={};cols.forEach(c=>{const dt=pd(c.d);const m=new Date(dt);m.setDate(m.getDate()-((m.getDay()+6)%7));const k=iso(m);w[k]=w[k]||{d:k,v:{}};for(const[r,x]of Object.entries(c.v))w[k].v[r]=Math.max(w[k].v[r]||0,x)});cols=Object.values(w).sort((a,b)=>a.d<b.d?-1:1)}
 const tot=c=>Object.values(c.v).reduce((a,b)=>a+b,0);
 const maxY=Math.max(1,...cols.map(tot));const pk=cols.reduce((a,c)=>tot(c)>tot(a)?c:a,cols[0]);
 const bw=hv.gran==='dia'?18:46,H=300,L=44,B=40,W=L+cols.length*bw+10;
 let svg=`<svg width="${W}" height="${H+B+10}" font-size="10" font-family="Segoe UI">`;
 const step=Math.ceil(maxY/6);for(let y=0;y<=maxY+step-1;y+=step){const py=H-y/maxY*H+5;svg+=`<line x1="${L}" x2="${W}" y1="${py}" y2="${py}" stroke="#e6eae4"/><text x="${L-6}" y="${py+3}" text-anchor="end" fill="#657067">${y}</text>`}
 cols.forEach((c,i)=>{let y=H+5;const x=L+i*bw;
  keys.forEach(k=>{const v=c.v[k];if(!v)return;const h=v/maxY*H;y-=h;svg+=`<rect x="${x+1}" y="${y}" width="${bw-2}" height="${h}" fill="${colorOf(k,keys)}"><title>${br(c.d)} — ${esc(k)}: ${fmt(v,hv.round&&hv.group==='recurso'?0:1)}</title></rect>`});
  svg+=`<text x="${x+bw/2}" y="${H+20}" text-anchor="middle" fill="#3b463d" transform="rotate(-60 ${x+bw/2} ${H+20})">${br(c.d).slice(0,5)}</text>`});
 svg+='</svg>';
 const stat=usedRes.map(r=>{let hh=0,dd=0,pico=0;usedComps().forEach(c=>{const h=sc[c.id].k.res[r];if(h)hh+=h});days.forEach(d=>{const v=map[d][r];if(v){dd++;pico=Math.max(pico,Math.ceil(v-1e-9))}});return{r,hh,dd,pico}});
 // Quantidade mensal: maior efetivo simultâneo requerido em cada mês.
 const months=[...new Set(days.map(d=>d.slice(0,7)))].sort();
 const monthLabel=m=>{const [y,mo]=m.split('-');return new Date(+y,+mo-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'})};
 const monthlyPeak=resources=>resources.map(r=>({r,vals:months.map(m=>{let peak=0;days.filter(d=>d.startsWith(m)).forEach(d=>{peak=Math.max(peak,map[d][r]||0)});return Math.ceil(peak-1e-9)})}));
 const labor=usedRes.filter(r=>TIPO[r]==='Mão de obra');
 const equipment=usedRes.filter(r=>TIPO[r]==='Equipamento');
 const monthlyLabor=monthlyPeak(labor);
 const monthlyEquipment=monthlyPeak(equipment);
 const laborTable=`<div class="card"><h4>Quantidade de mão de obra por mês</h4><div class="hint">Pico de profissionais simultaneamente requeridos por função em cada mês.</div><div class="scroll"><table><thead><tr><th>Mão de obra</th>${months.map(m=>`<th class="n">${esc(monthLabel(m))}</th>`).join('')}</tr></thead><tbody>${monthlyLabor.map(x=>`<tr><td>${esc(x.r)}</td>${x.vals.map(v=>`<td class="n">${v}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${months.length+1}" class="hint">Sem mão de obra programada.</td></tr>`}</tbody></table></div></div>`;
 const equipmentTable=`<div class="card"><h4>Quantidade de equipamentos por mês</h4><div class="hint">Pico de equipamentos simultaneamente requeridos por tipo em cada mês.</div><div class="scroll"><table><thead><tr><th>Equipamento</th>${months.map(m=>`<th class="n">${esc(monthLabel(m))}</th>`).join('')}</tr></thead><tbody>${monthlyEquipment.map(x=>`<tr><td>${esc(x.r)}</td>${x.vals.map(v=>`<td class="n">${v}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${months.length+1}" class="hint">Sem equipamentos programados.</td></tr>`}</tbody></table></div></div>`;
 $('#main').innerHTML=`<div class="card"><div class="row">
 <label>Agrupar por<select onchange="hv.group=this.value;rHist()"><option value="recurso" ${hv.group==='recurso'?'selected':''}>Recurso</option><option value="disc" ${hv.group==='disc'?'selected':''}>Disciplina da composição</option></select></label>
 <label>Tipo<select onchange="hv.tipo=this.value;rHist()">${['Todos','Mão de obra','Equipamento'].map(t=>`<option ${hv.tipo===t?'selected':''}>${t}</option>`).join('')}</select></label>
 <label>Escala<select onchange="hv.gran=this.value;rHist()"><option value="dia" ${hv.gran==='dia'?'selected':''}>Diária</option><option value="semana" ${hv.gran==='semana'?'selected':''}>Semanal (pico da semana)</option></select></label>
 <label>Pessoas inteiras<select onchange="hv.round=this.value==='1';rHist()"><option value="1" ${hv.round?'selected':''}>Arredondar p/ cima</option><option value="0" ${hv.round?'':'selected'}>Valor exato</option></select></label>
 <button onclick="csvHist()">Exportar CSV diário</button></div>
 <div class="kpis"><div class="kpi"><b>${fmt(maxY,hv.round?0:1)}</b><span>Pico (${hv.tipo==='Equipamento'?'equip.':hv.tipo==='Mão de obra'?'pessoas':'pessoas + equip.'})</span></div><div class="kpi"><b>${br(pk.d)}</b><span>Data do pico</span></div><div class="kpi"><b>${fmt(stat.filter(s=>TIPO[s.r]==='Mão de obra').reduce((a,s)=>a+s.hh,0),0)} h</b><span>HH de mão de obra</span></div><div class="kpi"><b>${fmt(stat.filter(s=>TIPO[s.r]==='Equipamento').reduce((a,s)=>a+s.hh,0),0)} h</b><span>Horas de equipamento</span></div></div>
 <div class="legend">${keys.map(k=>`<span><i style="background:${colorOf(k,keys)}"></i>${esc(k)}</span>`).join('')}</div>
 <div class="gantt" style="padding:6px">${svg}</div></div>
 <div class="card"><h4>Resumo por recurso</h4><table><thead><tr><th>Recurso</th><th>Tipo</th><th class="n">Horas totais</th><th class="n">Pico (qtd)</th><th class="n">Dias em uso</th></tr></thead><tbody>${stat.map(s=>`<tr><td>${esc(s.r)}</td><td>${TIPO[s.r]}</td><td class="n">${fmt(s.hh)}</td><td class="n">${s.pico}</td><td class="n">${s.dd}</td></tr>`).join('')}</tbody></table></div>${laborTable}${equipmentTable}`}
// export
function dl(name,txt,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click()}
function csvCron(){const sc=schedule();let t='\ufeff#;Composição;Disciplina;Duração (h);Equipe;Dias úteis;Início;Término\n';usedComps().forEach((c,i)=>{const s=sc[c.id];t+=[i+1,c.nome,c.disc,fmt(s.k.dur,2),crewLabel(c,s.k),s.k.days,br(iso(s.ini)),br(iso(s.fim))].join(';')+'\n'});dl('cronograma.csv',t,'text/csv')}
function csvHist(){const{map}=histo();const days=Object.keys(map).sort();const rs=REC.filter(r=>days.some(d=>map[d][r]));let t='\ufeffData;'+rs.join(';')+'\n';days.forEach(d=>{t+=br(d)+';'+rs.map(r=>map[d][r]?String(Math.ceil(map[d][r]-1e-9)):'').join(';')+'\n'});dl('histograma_diario.csv',t,'text/csv')}
function exportJSON(){dl('projeto_cronograma.json',JSON.stringify(S,null,1),'application/json')}
function importJSON(i){const f=i.files[0];if(!f)return;f.text().then(t=>{S=migrate(JSON.parse(t));sel=null;render()})}

async function carregarCatalogoDoBanco() {
  if (!sb) return null;
  try {
    const [rRes, rActs, rVer, rCoef] = await Promise.all([
      sb.from('resources').select('id, nome, tipo_id').eq('active', true),
      sb.from('unit_activities').select('id, codigo').eq('active', true),
      sb.from('unit_activity_versions')
        .select('id, activity_id, disciplina, escopo, servico, unidade, observacao, versao, status')
        .eq('status', 'publicado').eq('versao', 1),
      sb.from('unit_activity_resources').select('activity_version_id, resource_id, coeficiente_h_un')
    ]);
    if (rRes.error || rActs.error || rVer.error || rCoef.error) {
      console.warn('[Catálogo] erro no banco, usando fallback local');
      return null;
    }
    const nomePorId = Object.fromEntries(rRes.data.map(r => [r.id, r.nome]));
    const verPorAct = {};
    for (const v of rVer.data) verPorAct[v.activity_id] = v;
    const coefPorVer = {};
    for (const c of rCoef.data) {
      coefPorVer[c.activity_version_id] = coefPorVer[c.activity_version_id] || {};
      coefPorVer[c.activity_version_id][nomePorId[c.resource_id]] = Number(c.coeficiente_h_un);
    }
    const base = [];
    for (const a of rActs.data) {
      const v = verPorAct[a.id];
      if (!v) continue;
      base.push({
        cod: a.codigo,
        disc: v.disciplina || '',
        esc: v.escopo || '',
        serv: v.servico || '',
        un: v.unidade || '',
        fonte: '',
        obs: v.observacao || '',
        r: coefPorVer[v.id] || {}
      });
    }
    const recursos = rRes.data.map(r => [
      r.nome,
      r.tipo_id === 'mao_obra' ? 'Mão de obra' : 'Equipamento'
    ]);
    console.log(`[Catálogo] carregado do banco: ${recursos.length} recursos, ${base.length} atividades`);
    return { recursos, base };
  } catch (e) {
    console.warn('[Catálogo] falha:', e.message);
    return null;
  }
}

async function init() {
  // 1. Sempre começa com o estado local (nunca fica em branco)
  try {
    const raw = localStorage.getItem(KEY);
    S = raw ? JSON.parse(raw) : defaults();
  } catch (e) {
    S = defaults();
  }
  migrate(S);
  
    // Tenta enriquecer o catálogo do banco
  const cat = await carregarCatalogoDoBanco();
  if (cat && cat.base.length > 0) {
    // Substitui as constantes embutidas pelo catálogo do banco
    S.base = cat.base;
    // Atualiza REC e TIPO a partir do banco (por consistência)
    // REC/TIPO são const — não podemos reatribuir, mas o S.base já é suficiente
  }

  sel = null;
  render();
  atualizarNomeProjeto();

  // 2. Se Supabase disponível, tenta carregar o último projeto em background
  if (!sb) return;
  try {
    const { data, error } = await sb
      .from('projects')
      .select('*')
      .order('updated_at', { ascending: false })
      .limit(1)
      .maybeSingle();
    if (error) { console.warn('[Supabase] load:', error.message); return; }
    if (data) {
      currentProjectId = data.id;
      currentProjectName = data.name;
      S = data.state;
      migrate(S);
      atualizarNomeProjeto();
      render();
      console.log('[Supabase] projeto carregado:', data.name);
    }
    } catch (e) {
    console.warn('[Supabase] offline:', e.message);
  }

  initDone = true;   // ← libera o save após o init
}

init().catch(e => {
  console.error('[init] falhou:', e);
  try {
    S = S || defaults();
    migrate(S);
    render();
  } catch (e2) {
    document.getElementById('main').innerHTML =
      '<div class="card"><h3>Erro ao iniciar</h3><pre>' + e2.message + '</pre></div>';
  }
});
